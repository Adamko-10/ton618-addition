// TON 618 Addition: an unofficial addon for rimuru_dev's TON 618 (Forge 1.20.1; the same jar runs on NeoForge 1.20.1),
// built with ModDevGradle's legacyforge plugin like the SA Series' forge-1.20.1 branch.
//
//   1. Put RimuLib's and TON 618's Forge jars in libs/ (see libs/README.txt).
//   2. ./gradlew build        -> build/libs/ton618_addition-<version>.jar (reobfuscated to SRG names for Forge)
//      (no dev runs with TON 618: RimuLib's 1.20.1 mixins name SRG targets directly, which the dev game can't
//      remap; the SA Series doesn't run its Forge branches either. Test the built jar in a real game.)
//      ./gradlew build -Pneoforge   builds against NeoForge 1.20.1 instead (the jar is the same either way)
//
// Versions live in gradle.properties.
plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.+'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.20.1 is Java 17: compiled with the VM's JDK 21 for Java 17 (no JDK 17 installed; the bytecode is the
// same), and the dev runs use JDK 21 too.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenLocal()
    flatDir { dirs 'libs' }
}

legacyForge {
    if (project.hasProperty('neoforge')) {
        enable {
            neoForgeVersion = project.neoforge_version
        }
    } else {
        version = project.forge_version
    }

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
            loadedMods = [mods."${mod_id}"]
        }
        server {
            server()
            programArgument '--nogui'
            loadedMods = [mods."${mod_id}"]
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}


// RimuLib (compiled against: its public API) and TON 618 (only loaded in the dev runs). Both are All Rights Reserved
// and ship with SRG names: the plugin remaps them for the dev game. Never shipped inside this jar, never committed.
var rimulib = fileTree(dir: 'libs', include: 'rimulib*.jar')
var ton618 = fileTree(dir: 'libs', include: 'ton618*.jar')
if (rimulib.files.size() > 1) {
    throw new GradleException("libs/ has more than one RimuLib: ${rimulib.files*.name} - keep one")
}

dependencies {
    rimulib.each { File jar ->
        var module = "local:${jar.name - '.jar'}:0"
        modCompileOnly module
        modRuntimeOnly module
    }
    ton618.each { File jar ->
        modRuntimeOnly "local:${jar.name - '.jar'}:0"
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// Forge 1.20.1 runs SRG names: the mixins need a refmap, made by Mixin's annotation processor.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

tasks.named('jar', Jar) {
    manifest.attributes(['MixinConfigs': "${mod_id}.mixins.json"])
}

tasks.named('compileJava') {
    doFirst {
        if (rimulib.isEmpty()) {
            throw new GradleException("Put RimuLib's Forge jar (rimulib-<version>-forge.jar) in libs/ first - see libs/README.txt")
        }
    }
}

// mods.toml is filled in from gradle.properties.
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version_range: minecraft_version_range,
        forge_version_range    : forge_version_range,
        loader_version_range   : loader_version_range,
        ton618_mod_id          : ton618_mod_id,
        ton618_version_range   : ton618_version_range,
        rimulib_mod_id         : rimulib_mod_id,
        rimulib_version_range  : rimulib_version_range,
        shooting_star_mod_id   : shooting_star_mod_id,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
