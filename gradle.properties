# ---------------------------------------------------------------------------------------------------------------
# TON 618 Addition - an unofficial addon for rimuru_dev's TON 618 (Forge 1.20.1, also NeoForge 1.20.1)
# ---------------------------------------------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Minecraft / Forge (the same as the SA Series' forge-1.20.1 branch)
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
forge_version=1.20.1-47.4.10
neoforge_version=1.20.1-47.1.106
forge_version_range=[47.1,)
loader_version_range=[47,)
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# The mods this addon joins. Their jars go in libs/ (git-ignored, never shipped): see libs/README.txt.
ton618_mod_id=ton618
ton618_version_range=[1.1.0,)
rimulib_mod_id=rimulib
rimulib_version_range=[1.2.3,2.0)
# Optional: The Shooting Star (its Stellar Remote gets Last Light too when it is installed)
shooting_star_mod_id=shooting_star_demo

# This addon
mod_id=ton618_addition
mod_name=TON 618 Addition
mod_license=All Rights Reserved
mod_version=1.1.2
mod_group_id=dev.adamko.ton618addition
mod_authors=adamko_10
mod_description=An unofficial addon for TON 618 by rimuru_dev. TA-01 Last Light: after TON 618 has devoured the world, fast-forward time until TON618 evaporates by Hawking radiation, and its last light brings the world back. TA-02 Quasar Jets (with SS-21 Quasar): launch a named star into TON618, and its quasar jet strikes the ground. Needs TON 618 and RimuLib.
