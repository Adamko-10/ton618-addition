<html><head><meta charset="utf-8"><title>Last Light polish check</title>
<style>body{margin:0;background:#111;color:#ccc;font:12px monospace}canvas{display:block;width:1280px;height:720px}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas><div id="log"></div>
<script>
// Mirrors FilmCamera.dark and FilmWorld.dark (after the 2026-11 polish) and draws them with the film's real shader over
// Codex's 3 s game frame, re-projected as a sky backdrop. `old` = the 1.0.0 numbers, for comparison.
const log = m => { document.getElementById('log').textContent += m + '\n'; };
const sat = x => x < 0 ? 0 : Math.min(x, 1), lerp = (a, b, u) => a + (b - a) * u, lin = (a, b, x) => sat((x - a) / (b - a));

const cv = document.getElementById('c'), gl = cv.getContext('webgl2', {preserveDrawingBuffer: true, antialias: true});

const es = s => s.replace('#version 150', '#version 300 es\nprecision highp float;');
async function init() {

in vec3 Position; out vec2 p; void main(){ p = Position.xy; gl_Position = vec4(Position.xy, 0.999, 1.0); }`, `#version 300 es
precision highp float; in vec2 p; out vec4 o; uniform sampler2D T; uniform vec3 D, R, U, D0, R0, U0; uniform vec2 F;
void main(){ vec3 ray = normalize(D + R * p.x * F.x * 1.7777778 + U * p.y * F.x);

let verts = [];
const cl = v => v < 0 ? 0 : Math.min(v, 1);

  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 36, 12);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 36, 20);

function box(x0, x1, y0, y1, z0, z1, col) { // local: x along RTV, z along FW

  const f = (a, b, c2, d, s) => quad([...a, ...c(s)], [...b, ...c(s)], [...c2, ...c(s)], [...d, ...c(s)]);

function wall(radius, height, r, g, b, a) {

    const x0 = Math.cos(a0) * radius, z0 = Math.sin(a0) * radius, x1 = Math.cos(a1) * radius, z1 = Math.sin(a1) * radius;
    quad([x0, 1, z0, 0, 0, r, g, b, a], [x1, 1, z1, 1, 0, r, g, b, a], [x1, 1 + height, z1, 1, 1, r, g, b, a], [x0, 1 + height, z0, 0, 1, r, g, b, a]); }
}
const MOTE = (() => { let s = 11; const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff; const m = []; for (let i = 0; i < 220; i++) m.push([(rnd() - 0.5) * 30, rnd() * 10, (rnd() - 0.5) * 30, 0.05 + rnd() * 0.06]); return m; })();

  gl.viewport(0, 0, 1280, 720); gl.disable(gl.BLEND); gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

function effects(t, cam, m, old) {

    else { const a = Math.pow(1 - ru, 1.5); quad([-s, 1.04, -s, -1, -1, 1, 0.86, 0.66, a], [-s, 1.04, s, -1, 1, 1, 0.86, 0.66, a], [s, 1.04, s, 1, 1, 1, 0.86, 0.66, a], [s, 1.04, -s, 1, -1, 1, 0.86, 0.66, a]); flush(prog, m, 5, [0.9, 0.3, 0.35, 0]); } }

window.check = {draw, ready: () => ready};
